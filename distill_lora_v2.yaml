### 蒸馏训练 v2：B 线通用补习（修 -4.75pt 遗忘）###
### 数据 = 460 数学（v1 原数据）+ 184 通用锚点（MMLU val，老师 CoT）= 644 条 ###
### 与 v1 配置的唯一差异：dataset 与 output_dir——保「唯一变量=数据」的归因 ###
### 跑法: cd ~/distill/LLaMA-Factory && ~/distill/venv/bin/llamafactory-cli train ~/distill/configs/distill_lora_v2.yaml ###

model_name_or_path: /home/melody/distill/models/Qwen3-1.7B
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05

dataset: distill_v2_mix
dataset_dir: /home/melody/distill/data
template: qwen3
cutoff_len: 1024

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
logging_steps: 10

val_size: 0.05
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 50

save_strategy: epoch
gradient_checkpointing: true

output_dir: /home/melody/distill/models/distill-v2
overwrite_output_dir: true
report_to: none
