### A 线重训：清洗版 4B 数据（格式因素隔离实验）###
### 与 distill_lora_4b.yaml 的差异：dataset（清洗版）、output_dir、dataloader_num_workers（纯提速不影响结果）###
### 跑法: cd ~/distill/LLaMA-Factory && ~/distill/venv/bin/llamafactory-cli train ~/distill/configs/distill_lora_4b_clean.yaml ###

model_name_or_path: /home/melody/distill/models/Qwen3-1.7B
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05

dataset: distill_train_4b_clean
dataset_dir: /home/melody/distill/data
template: qwen3
cutoff_len: 1024

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
logging_steps: 10

val_size: 0.05
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 50

save_strategy: epoch
gradient_checkpointing: true

# GPU 喂料优化：dataloader 后台预取，关闭 GPU 等数据的空档（不影响训练结果，纯提速）
dataloader_num_workers: 4

output_dir: /home/melody/distill/models/distill-4b-clean
overwrite_output_dir: true
report_to: none
